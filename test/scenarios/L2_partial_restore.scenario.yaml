# L2_partial_restore.scenario.yaml
#
# Tier L2 — partial-restore cross-cover.  2nd touch for the
# partial family.
#
# Uses pg_catalog tables (always present in any PG) as the
# positive-path target so the scenario doesn't depend on a
# load file's bootstrap phase succeeding.  Negative paths
# target deliberately-missing user tables.
#
# Leaves covered (gate scope — 2nd touch):
#   * partial inspect (2nd, pg_catalog.pg_class)
#   * partial dump (2nd, negative — no user tables)
#   * partial restore (2nd, negative)
#
# Wall-clock budget: ~30s.

schema: pg_hardstorage.scenario.v1

# `partial dump` restores into a sandbox and drives it with pg_ctl, so
# it needs PostgreSQL SERVER binaries on the host — not just the client
# package. Declared for the same reason
# L3_partial_dump_database_flag declares it: without them the command
# refuses at preflight with `preflight.pg_tools_missing`, which is a
# statement about the host and not about pg_hardstorage.
#
# This scenario asserted that refusal by accident. Its negative dump
# step expected exit 4 and passed for years on hosts with no server
# binaries, so the not-found path it describes was never once
# exercised. Skip honestly instead of passing on an environmental
# coincidence.
requires:
  host_tools: [pg_ctl]
name: L2-partial-restore
tier: L2
description: |
  take_backup → partial inspect pg_catalog (positive) →
  partial dump / restore against missing user table
  (negative).

topology:
  provider: local-docker
  pg_version: "17"

steps:
  - take_backup:
      deployment: l2-partial-restore

  # 1. inspect against pg_catalog.pg_class — every backup's
  # manifest includes the system catalogs, so this is a
  # reliable positive-path probe.
  - cli_run:
      args:
        - "partial"
        - "inspect"
        - "$DEPLOYMENT"
        - "--repo"
        - "$REPO"
        - "--tables"
        - "pg_catalog.pg_class"
        - "--pg-connection"
        - "$PG_CONN"
      expect_exit: 0
      timeout: 60s

  # 2. Negative dump — user table doesn't exist, so pg_dump
  # matches nothing and the command must refuse with exit 6
  # (ExitNotFound, code partial.dump_no_tables) rather than
  # writing an empty .sql and claiming success.
  - cli_run:
      args:
        - "partial"
        - "dump"
        - "$DEPLOYMENT"
        - "--repo"
        - "$REPO"
        - "--tables"
        - "public.no_such_user_table"
        - "--sql-file"
        - "$ARTEFACT_DIR/partial-dump-data.sql"
        # The sandbox is a cluster restored from THIS backup, so
        # pg_dump must connect as a role that exists in it. The
        # testbed's bootstrap superuser is $PG_USER, not the
        # "postgres" default and certainly not the host login.
        - "--pg-user"
        - "$PG_USER"
      expect_exit: 6
      timeout: 60s

  # 3. Negative restore — same.
  - cli_run:
      args:
        - "partial"
        - "restore"
        - "$DEPLOYMENT"
        - "--repo"
        - "$REPO"
        - "--tables"
        - "public.no_such_user_table"
        - "--target"
        - "$ARTEFACT_DIR/partial-target"
        - "--pg-connection"
        - "$PG_CONN"
      expect_exit: 0
      timeout: 60s

cleanup:
  on_success: tear_down
  on_failure: "keep_for:1h"
