# L8_repo_bundle_export_smoke.scenario.yaml
#
# Tier L8 — `repo bundle export` produces an
# air-gap-transportable .tar of the deployment's
# manifests + chunks + (optionally) WAL.  Used for
# moving backups across security boundaries (e.g. from
# a high-side production repo into an investigator's
# isolated environment) without needing network
# access between the two.
#
# This scenario pins the export-side contract:
#   1. After a 3-backup chain, `repo bundle export
#      --deployment X --out <path>` produces a non-
#      empty .tar.
#   2. `repo bundle export --backup-id <specific>`
#      narrows to one manifest; output is smaller.
#   3. `--include-wal` REFUSES while no manifest carries a
#      wal_required list, rather than shipping a bundle
#      with no WAL in it (which cannot be restored).
#
# Import-side verification (round-trip into a fresh
# repo + restore from the imported bundle) is left to
# a future scenario — that path needs a second repo URL
# in scenario state, which the runner doesn't expose
# as a placeholder today.
#
# Wall-clock budget: ~3 minutes (1 GB seed + 3 backups +
# 3 export probes).
schema: pg_hardstorage.scenario.v1
name: L8-repo-bundle-export-smoke
tier: L8
description: |
  3 backups → repo bundle export (all backups) →
  export --backup-id (specific backup) → export
  --include-wal.  The first two produce a non-empty .tar;
  the third refuses, because a WAL-less "self-contained"
  bundle is unrestorable.

topology:
  provider: local-docker
  pg_version: "17"

steps:
  - seed:
      target_gb: 1

  - take_backup:
      deployment: l8-bundle-export
      name: backup_1

  - take_backup:
      deployment: l8-bundle-export
      name: backup_2

  - take_backup:
      deployment: l8-bundle-export
      name: backup_3

  # Export every live backup for the deployment.
  - cli_run:
      args:
        - "repo"
        - "bundle"
        - "export"
        - "--repo"
        - "$REPO"
        - "--deployment"
        - "$DEPLOYMENT"
        - "--out"
        - "$ARTEFACT_DIR/bundle-all.tar"
      timeout: 60s

  # Export a specific backup-id.  Output is smaller
  # than the all-backups bundle above (it's only one
  # manifest's worth of chunks).
  - cli_run:
      args:
        - "repo"
        - "bundle"
        - "export"
        - "--repo"
        - "$REPO"
        - "--deployment"
        - "$DEPLOYMENT"
        - "--backup-id"
        - "$LAST_BACKUP"
        - "--out"
        - "$ARTEFACT_DIR/bundle-one.tar"
      timeout: 60s

  # --include-wal must REFUSE, not produce a WAL-less bundle.
  #
  # The option draws its segment list from each manifest's
  # `wal_required`, and nothing in the backup runner populates that
  # field, so the loop body never executed: every bundle exported
  # with --include-wal was a bundle with no WAL, and a base backup
  # cannot reach a consistent state without the WAL between its start
  # and stop LSN. Since this is an air-gap export, that only surfaced
  # at restore time, from the air-gapped copy.
  #
  # Export now refuses rather than shipping something that looks
  # complete. This step pins the refusal: when `wal_required` is
  # eventually populated, this expectation flips back to 0 together
  # with the implementation.
  - cli_run:
      args:
        - "repo"
        - "bundle"
        - "export"
        - "--repo"
        - "$REPO"
        - "--deployment"
        - "$DEPLOYMENT"
        - "--include-wal"
        - "--out"
        - "$ARTEFACT_DIR/bundle-with-wal.tar"
      expect_exit: 1
      expect_stderr_contains: "--include-wal was requested"
      timeout: 60s

cleanup:
  on_success: tear_down
  on_failure: "keep_for:1h"
