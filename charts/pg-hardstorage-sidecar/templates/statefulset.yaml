apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pg-hardstorage-sidecar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pg-hardstorage-sidecar.labels" . | nindent 4 }}
spec:
  # StatefulSet -- the agent's local state (inflight markers,
  # audit log, manifest cache) must stay attached to a stable
  # pod identity. A Deployment with a PVC works for storage
  # but loses pod ordinality on rollout.
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "pg-hardstorage-sidecar.fullname" . }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "pg-hardstorage-sidecar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pg-hardstorage-sidecar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the config changes so a `helm upgrade`
        # of the values file actually takes effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pg-hardstorage-sidecar.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "pg-hardstorage-sidecar.keyringEnabled" . }}
      initContainers:
        # See the keyring-src volume comment: Secrets cannot be
        # mounted at the keyring path directly because fsGroup mangles
        # their modes past what the keystore's gates allow. The agent
        # image is distroless, so the agent itself carries the copy.
        - name: install-keyring
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - keyring
            - install
            - --from=/keyring-src
            - --to=/etc/pg_hardstorage/keyring
          # Same hardened context as the main container. There is no use
          # case for a different security posture on the keyring-install
          # init step, and the previously-referenced .Values.container
          # SecurityContext was never defined in values.yaml, so this
          # initContainer silently ran with an EMPTY securityContext
          # (issue #49). readOnlyRootFilesystem is fine here: the install
          # writes only to the mounted `keyring` emptyDir, not the root fs.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: keyring-src
              mountPath: /keyring-src
              readOnly: true
            - name: keyring
              mountPath: /etc/pg_hardstorage/keyring
      {{- end }}
      containers:
        - name: pg-hardstorage
          image: {{ include "pg-hardstorage-sidecar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - agent
            {{- with .Values.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: PG_HARDSTORAGE_CONFIG_DIR
              value: /etc/pg_hardstorage
            - name: PG_HARDSTORAGE_STATE_DIR
              value: /var/lib/pg_hardstorage
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pg_hardstorage
              readOnly: true
            - name: state
              mountPath: /var/lib/pg_hardstorage
            # Distroless + readOnlyRootFilesystem leaves /tmp
            # unwritable by default; the agent uses it for
            # short-lived staging files.
            - name: tmp
              mountPath: /tmp
            {{- if include "pg-hardstorage-sidecar.keyringEnabled" . }}
            # The keyring the docs promised and the chart never
            # mounted (issue #46). Read-only: the agent reads the KEK,
            # it never writes here.
            - name: keyring
              mountPath: /etc/pg_hardstorage/keyring
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pg-hardstorage-sidecar.fullname" . }}-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if include "pg-hardstorage-sidecar.keyringEnabled" . }}
        # The Secret material lands here (keyring-src) and is COPIED
        # into the keyring emptyDir by the install-keyring
        # initContainer. Mounting the Secret directly at the keyring
        # path cannot work: fsGroup makes kubelet OR group-read into
        # every projected file (issue #46's follow-up demonstrated
        # 0600→0640), and the keystore refuses any group/other bit on
        # kek.bin and the signing key — correctly. The copy lands the
        # files owned by the runAsUser with owner-only modes, immune
        # to fsGroup.
        - name: keyring
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: keyring-src
          {{- if include "pg-hardstorage-sidecar.keyringProjected" . }}
          # Projected: the three keyring files may come from three
          # different Secrets, and they must all land in one directory.
          # Separate `secret` volumes cannot share a mount path.
          #
          # `path` is the filename the agent looks for and is NOT taken
          # from values — a keyring with the right bytes under the wrong
          # name looks populated and does not work. Pinned against the
          # product's own constants by TestChartKeyringFilenamesMatchTheProduct.
          projected:
            defaultMode: {{ .Values.keyring.defaultMode }}
            sources:
              {{- with .Values.keyring.kek.secretName }}
              - secret:
                  name: {{ . | quote }}
                  items:
                    - key: {{ $.Values.keyring.kek.key | quote }}
                      path: kek.bin
              {{- end }}
              {{- with .Values.keyring.signingKey.secretName }}
              - secret:
                  name: {{ . | quote }}
                  items:
                    - key: {{ $.Values.keyring.signingKey.key | quote }}
                      path: manifest_signing.ed25519
              {{- end }}
              {{- with .Values.keyring.signingPub.secretName }}
              - secret:
                  name: {{ . | quote }}
                  items:
                    - key: {{ $.Values.keyring.signingPub.key | quote }}
                      path: manifest_signing.pub
              {{- end }}
          {{- else }}
          secret:
            secretName: {{ .Values.keyring.existingSecret | default (printf "%s-keyring" (include "pg-hardstorage-sidecar.fullname" .)) }}
            defaultMode: {{ .Values.keyring.defaultMode }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: state
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
