{{- /*
Keyring Secret — the local KEK and any signing material.

This is a Secret, not a ConfigMap, and that is the whole point of
issue #46. The chart's documentation used to say the keyring "mounts
as part of the ConfigMap"; the ConfigMap never templated it, and had
it done so the private signing key and kek.bin would have been
readable by anyone with `get configmap` in the namespace — which is a
lower bar than `get secret` in every cluster that bothers to separate
them.

Rendered only when keyring.files is non-empty AND no existingSecret is
named: bringing your own Secret (sealed-secrets, external-secrets, a
cloud CSI driver) is the better path and the one the docs lead with.
*/ -}}
{{- if and .Values.keyring.files (not .Values.keyring.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pg-hardstorage-sidecar.fullname" . }}-keyring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pg-hardstorage-sidecar.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /*
  Values are base64 already: kek.bin is 32 raw bytes and cannot be
  carried as YAML text. `data:` takes base64 verbatim, so what the
  operator pastes is what lands.
  */ -}}
  {{- range $name, $b64 := .Values.keyring.files }}
  {{ $name }}: {{ $b64 | quote }}
  {{- end }}
{{- end }}
