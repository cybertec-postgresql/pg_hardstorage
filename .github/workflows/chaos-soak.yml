# chaos-soak.yml — nightly randomized chaos soak with a restore-proof
# gate (integrity program #1; see docs/operations/integrity-testing.md).
#
# Runs the production model — encrypted repo, continuous `wal stream`,
# concurrent backups, constant churn — over a real 3-node Patroni
# cluster while injecting a seeded random fault schedule (switchovers,
# leader pauses, concurrent-backup bursts). Pass criterion is never
# "exit 0": every committed backup must verify --full AND restore, the
# WAL lineage must be gap-free, and exactly one shared-DEK object may
# exist. This is the harness class that would have caught #31 and #34
# before users did.
#
# A failure log always includes the seed; re-run the identical fault
# schedule with:  workflow_dispatch → seed=<seed>.
name: chaos-soak

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soak budget in minutes"
        # Empty: the gate auto-sizes its fault window from the go-test
        # budget (1/8, capped 20m). Runner-hardware upgrades made the
        # old fixed 45 outgrow the verify budget (203-217 backups, only
        # ~100 verifiable) — set a number here only to override.
        default: ""
      seed:
        description: "Fault-schedule seed (empty = random)"
        default: ""

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

# Three independent lanes, not three steps in one job.
#
# They used to share a single job capped at timeout-minutes: 120 while
# their own step timeouts summed to 30m + 5h + 110m. The chaos soak ran
# LAST, so whenever the earlier lanes ran long it was the restore-proof
# gate — the strongest data-loss guard in the repository — that got cut
# off. It went that way three nights running (2026-08-04, -05, -06),
# each capped at ~2h, after finishing in ~1h35m on the three nights
# before.
#
# The status made it easy to miss: a job killed by timeout-minutes is
# reported as CANCELLED, which reads as "somebody stopped it" rather
# than "the gate never ran". Separate lanes mean a slow soak can no
# longer starve the gate, and a timeout now names the lane that
# overran.
jobs:
  model-check:
    name: repo model check (randomized)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Deep randomized repo model check
        env:
          PGHS_MODELCHECK_OPS: "2000"
          PGHS_MODELCHECK_BUDGET: "20m"
        run: |
          go test -count=1 -timeout 30m -v -run TestModelCheck_Randomized ./internal/cli/

  storage-soaks:
    name: storage backend soaks (long)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The storage soaks default to a ~15s smoke so the routine
      # integration job stays inside its budget; length is what finds
      # resource exhaustion and slow leaks, so the nightly is where it
      # is actually paid for.
      - name: Storage backend soaks (long)
        env:
          # Honest envelope: BOTH soaks iterate every container backend
          # (5 today), so the programmed total is 5×(storage+fault)
          # minutes. 5×(4+2)=30m fits the step's 60m -timeout with the
          # fixture overhead; the in-test fitSoakBudget cap logs loudly
          # if a future backend count breaks this arithmetic again.
          PGHS_STORAGE_SOAK_MINUTES: "4"
          PGHS_FAULT_SOAK_MINUTES: "2"
        run: |
          go test -tags integration -count=1 -timeout 60m -v \
            -run 'TestBackendSoak|TestFaultSoak' \
            ./internal/plugin/storage/

  boot-proofs:
    name: boot proofs (PG accepts the archive, majors 16-19)
    runs-on: ubuntu-24.04
    # Two go-test steps below carry 35m + 25m of their own -timeout, so
    # the job budget must exceed 60m — TestCIJobBudgetsOutlastTheirTests
    # enforces this arithmetic from the YAML. A job killed by
    # timeout-minutes reports CANCELLED with no stacks and no test name,
    # which is how the restore-proof gate once starved for three nights
    # unnoticed.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The strongest assertions the 2026-08 campaign produced: per
      # PostgreSQL major (16/17/18, plus 19 auto-probed across beta
      # tags), a full backup → archive → restore --to-latest → BOOT →
      # promote → query loop, and the retention-then-recovery proof
      # that the janitors never break what they keep. Object-level
      # checks cannot see a replay hole; these can.
      - name: restore-boot matrix + retention-then-recovery
        run: |
          go test -tags integration -count=1 -timeout 35m -v             -run 'TestRestoreBootMatrix_ArchiveReplayAcrossMajors|TestRetentionThenRecovery_PrunedArchiveStillBoots'             ./internal/testkit/topology/
      # The campaign's crown assertion, previously run only by hand: a
      # real 3-node Patroni cluster, a switchover, and PostgreSQL
      # itself replaying the ENCRYPTED archive across the timeline
      # boundary via the captured history file to serve the
      # post-failover row.
      - name: cross-timeline PITR boot proof (Patroni)
        run: |
          go test -tags 'integration patroni' -count=1 -timeout 25m -v             -run 'TestPITR_AcrossAFailover'             ./internal/testkit/topology/

  chaos-soak:
    name: chaos soak (restore-proof gate)
    runs-on: ubuntu-24.04
    # The gate is O(backups) and each iteration is a full verify plus a
    # real restore. 45 minutes of faults produces enough backups that
    # the gate is the longest phase by far, so it gets its own lane and
    # a budget that fits both halves.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build the binary under test
        run: go build -o /tmp/pghs-chaos ./cmd/pg_hardstorage
      - name: Pre-pull cluster images
        run: |
          docker pull -q ghcr.io/zalando/spilo-17:4.0-p1
          docker pull -q quay.io/coreos/etcd:v3.5.13
      - name: Run the soak
        env:
          PGHS_CHAOS_BIN: /tmp/pghs-chaos
          # No default: unset lets the gate auto-size its fault window
          # from the go-test budget (⅛ of it, capped at 20m). The fixed
          # 45 outgrew TWO hosts' verify budgets in one week — a fast
          # local box and, post-upgrade, the CI runners themselves
          # (PROOF INCOMPLETE 106/203, every verified backup passing).
          PGHS_CHAOS_MINUTES: ${{ github.event.inputs.minutes }}
          PGHS_CHAOS_SEED: ${{ github.event.inputs.seed || '' }}
        run: |
          go test -tags chaos -count=1 -timeout 150m -v \
            -run TestChaosSoak_RestoreProof \
            ./internal/testkit/topology/
