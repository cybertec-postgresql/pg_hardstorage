# Release — fires on tag push (v*).
#
# Builds reproducible binaries via goreleaser, generates SBOMs via syft,
# signs everything via cosign keyless (Sigstore OIDC against the GitHub
# Actions OIDC issuer), publishes a GitHub Release with attached
# checksums + .deb + .rpm, and pushes container images to GHCR.
#
# We don't publish to package registries (distro repos,
# Helm chart repo) from this workflow — that's a manual step gated on
# manual review of the release notes. goreleaser's GitHub Release is
# the authoritative artefact source.

name: release

on:
  push:
    tags: ["v*"]
  # Manual entry point to run ONLY the Homebrew cask smoke test against an
  # already-published version (goreleaser/SLSA are skipped). Lets us verify
  # the tap install on demand without cutting a release.
  workflow_dispatch:
    inputs:
      smoke_version:
        description: "Version to run the Homebrew smoke test against, e.g. 1.0.13"
        required: false
        default: ""
      provenance_tag:
        description: "Backfill SLSA provenance for an ALREADY-PUBLISHED tag, e.g. v1.1.0"
        required: false
        default: ""

permissions:
  contents: write       # create the GitHub Release
  packages: write       # push images to GHCR
  id-token: write       # cosign keyless via OIDC

env:
  GO_VERSION: "1.26.5"

jobs:
  goreleaser:
    name: goreleaser
    # Real releases only run on a tag push; a manual workflow_dispatch runs
    # just the Homebrew smoke test against an existing release.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # goreleaser needs full history for changelog
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0
      - name: set up QEMU (multi-arch image builds)
        if: vars.PUBLISH_CONTAINERS == 'true'
        uses: docker/setup-qemu-action@v3
      - name: set up Docker Buildx
        if: vars.PUBLISH_CONTAINERS == 'true'
        uses: docker/setup-buildx-action@v3
      - name: docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fail in seconds on a wired-but-EMPTY secret instead of six
      # minutes deep, after every artifact has already been published.
      #
      # HOMEBREW_TAP_TOKEN is the standing case: it is correctly wired
      # to secrets.HOMEBREW_TAP_TOKEN, so no static check can see the
      # problem — the secret itself is unset or not scoped to this repo,
      # expands to an empty string, and GitHub answers 401 at the very
      # last goreleaser step. The release is already live by then, and
      # the failed job used to take SLSA provenance down with it.
      #
      # Non-fatal for the tap token specifically: an empty value means
      # the cask will not publish, which is survivable and already the
      # status quo. It is surfaced loudly and early rather than silently
      # at the end. GITHUB_TOKEN is fatal — nothing can publish without
      # it.
      - name: preflight-secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ALLOW_MISSING_TAP_TOKEN: ${{ vars.ALLOW_MISSING_TAP_TOKEN }}
        run: |
          set -u
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error title=Missing secret::GITHUB_TOKEN is empty; nothing can be published."
            exit 1
          fi
          # These are ERRORS, not warnings, and they run before anything
          # is built. HOMEBREW_TAP_TOKEN turned out never to have been
          # set at all: goreleaser sent an empty credential, GitHub
          # answered "401 Bad credentials", and that reads like a scope
          # problem — so four releases were spent looking at token
          # permissions for a secret that did not exist. A warning was
          # what let it survive: warnings fail nothing, and the run went
          # red 6m46s later for a reason that named the wrong cause.
          if [ "${ALLOW_MISSING_TAP_TOKEN:-}" = "true" ]; then
            echo "::warning title=Cask publishing disabled::repo variable ALLOW_MISSING_TAP_TOKEN=true, so the tap credential is not checked and this release will publish WITHOUT a Homebrew cask."
          elif [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error title=Missing secret::HOMEBREW_TAP_TOKEN is not set, so the Homebrew cask cannot be published. Set it with: gh secret set HOMEBREW_TAP_TOKEN --repo ${{ github.repository }} — it needs contents:write on ${{ github.repository_owner }}/homebrew-tap. To cut a release deliberately without a cask, set the repo variable ALLOW_MISSING_TAP_TOKEN=true."
            exit 1
          else
            # Presence is not enough: the 401 is a VALUE problem, so
            # only a live call against the tap proves the credential.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
              "https://api.github.com/repos/${{ github.repository_owner }}/homebrew-tap" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error title=Tap credential rejected::GET /repos/${{ github.repository_owner }}/homebrew-tap returned $code, so goreleaser's cask push will fail the same way at the END of the release. Re-issue the token with contents:write on the tap, or set the repo variable ALLOW_MISSING_TAP_TOKEN=true to release without a cask."
              exit 1
            fi
            echo "HOMEBREW_TAP_TOKEN reaches the tap (200)."
          fi

      - name: goreleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          # Container images publish to GHCR only when the repo/org
          # variable PUBLISH_CONTAINERS == 'true'. Until the org enables
          # Actions package-write on ghcr.io (otherwise the push fails
          # `denied: permission_denied: write_package` and aborts the
          # whole release), --skip=docker is passed so the binaries /
          # .deb / .rpm / Homebrew / GitHub Release still ship. Flip the
          # variable to 'true' once GHCR is enabled, then re-tag to
          # publish images. (--skip=docker covers docker_manifests too.)
          args: release --clean ${{ vars.PUBLISH_CONTAINERS == 'true' && '' || '--skip=docker' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate fine-grained PAT (contents:write on the homebrew-tap
          # repo) so goreleaser can push the updated formula there; the
          # default GITHUB_TOKEN can't write a second repo.  Consumed by
          # the brews: stanza in .goreleaser.yaml.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Capture the goreleaser-emitted artifact list as JSON so the
      # SLSA generator can compute checksums for the binaries +
      # archives + .deb + .rpm.  goreleaser writes this to
      # dist/artifacts.json by default.
      - name: collect artifact metadata
        id: collect-artifacts
        # Run even when the goreleaser step reported failure. goreleaser
        # publishes the release + all artifacts BEFORE its cask-push step,
        # which fails today on the tap token (HOMEBREW_TAP_TOKEN, 401). With
        # the default on-success condition this step was skipped, the
        # subject-checksums output was empty, and the SLSA job below was
        # skipped with it — so a *cask publishing* failure silently cost the
        # release its supply-chain attestation. It did exactly that on
        # v1.0.16, v1.0.17 and v1.1.0. Same reasoning as homebrew-smoke's
        # `!cancelled()` below.
        if: ${{ !cancelled() }}
        run: |
          # subject-checksums maps to the SLSA generator's expected
          # input shape: a base64-encoded text blob, one
          # "<sha256>  <filename>" line per artifact.
          checksums=$(cd dist && sha256sum *.tar.gz *.zip *.deb *.rpm 2>/dev/null | base64 -w0 || true)
          if [ -z "$checksums" ]; then
            echo "no artifacts to attest"
            exit 0
          fi
          echo "subject-checksums=$checksums" >> "$GITHUB_OUTPUT"
    outputs:
      subject-checksums: ${{ steps.collect-artifacts.outputs.subject-checksums }}

  # SLSA Level 3 build provenance.  The reusable generator is
  # documented at https://github.com/slsa-framework/slsa-github-generator.
  # It runs on a separate, locked-down GitHub-hosted runner that has
  # access to OIDC but NOT the goreleaser-built artifacts directly —
  # that's the SLSA L3 isolation invariant.  The generator signs
  # the provenance keylessly via Sigstore + uploads the
  # ".intoto.jsonl" attestation to the same GitHub Release.
  #
  # Verifying a release post-hoc:
  #   slsa-verifier verify-artifact \
  #       --provenance-path pg_hardstorage_<ver>_linux_amd64.intoto.jsonl \
  #       --source-uri github.com/cybertec-postgresql/pg_hardstorage \
  #       --source-tag v0.7.0 \
  #       pg_hardstorage_<ver>_linux_amd64.tar.gz
  slsa-provenance:
    name: SLSA L3 provenance
    needs: [goreleaser]
    # `!cancelled()` rather than the default on-success: see the
    # collect-artifact-metadata step. The real guard is the checksum output
    # being non-empty — if goreleaser died BEFORE building anything there is
    # nothing to attest and this correctly does not run.
    if: ${{ !cancelled() && needs.goreleaser.outputs.subject-checksums != '' }}
    permissions:
      actions: read       # required for SLSA L3 isolation
      id-token: write     # OIDC token for keyless signing
      contents: write     # upload the .intoto.jsonl to the Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.subject-checksums }}"
      upload-assets: true
      provenance-name: pg_hardstorage.intoto.jsonl

  # End-to-end verification of the real user path: `brew install --cask`
  # from the public tap on a macOS runner, then run the installed binary.
  # This is the one thing the local (Linux) release checks can't cover —
  # Homebrew evaluates the cask's Ruby DSL and symlinks the binary into
  # $PATH, which only happens on macOS/brew.
  #
  # The tap cask is updated either by goreleaser (when HOMEBREW_TAP_TOKEN
  # is valid) or manually shortly after the release, so this job POLLS
  # the tap until it serves this release's version before installing. If
  # the cask hasn't been pushed yet it fails cleanly — re-run just this
  # job (Actions → this run → "Re-run failed jobs") after the cask lands.
  homebrew-smoke:
    name: Homebrew cask install (macOS)
    needs: [goreleaser]
    # Run even when goreleaser reports failure: the release artifacts are
    # published before goreleaser's cask-push step (which fails today on the
    # tap token, HOMEBREW_TAP_TOKEN), so the tarballs the cask points at DO
    # exist. Without this the job is always skipped. `!cancelled()` still
    # skips on a manual workflow cancel.
    # On a manual dispatch, only run when a version was actually supplied —
    # a provenance-only backfill dispatch must not trip the cask smoke test.
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.smoke_version != '') }}
    runs-on: macos-latest
    steps:
      - name: Derive release version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.smoke_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the tap cask to reflect this release
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          url="https://raw.githubusercontent.com/cybertec-postgresql/homebrew-tap/main/Casks/pg_hardstorage.rb"
          for i in $(seq 1 20); do
            got=$(curl -fsSL "$url" | sed -n 's/^[[:space:]]*version "\(.*\)"/\1/p' | head -1 || true)
            echo "attempt $i/20: tap cask version=${got:-<none>} want=$WANT"
            if [ "$got" = "$WANT" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::tap cask did not reach $WANT within ~10 min — push the cask, then re-run this job"
          exit 1
      - name: brew install --cask from the tap
        run: |
          brew update --quiet || true
          brew install --cask cybertec-postgresql/tap/pg_hardstorage
      - name: Smoke-test the installed binary
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          out=$(pg_hardstorage --version)
          echo "$out"
          echo "$out" | grep -q "$WANT" || { echo "::error::--version ($out) does not report $WANT"; exit 1; }
          pg_hardstorage --help >/dev/null
          repo="file://$(mktemp -d)/repo"
          pg_hardstorage repo init "$repo" >/dev/null
          pg_hardstorage glossary RPO >/dev/null
          echo "✓ brew-installed pg_hardstorage $WANT runs (version, help, repo init, glossary)"

  # ---------------------------------------------------------------------
  # Provenance backfill for an already-published release.
  #
  # Normally provenance is generated in the same run that builds the
  # artifacts (the slsa-provenance job above). This path exists for
  # releases that shipped WITHOUT it — v1.0.16, v1.0.17 and v1.1.0 all
  # lost their attestation because a Homebrew cask-push failure aborted
  # goreleaser and skipped the SLSA job downstream of it.
  #
  # HONEST LIMITATION: the provenance produced here names THIS backfill
  # run as the builder, not the original release run — a post-hoc
  # attestation cannot claim to have observed a build it did not perform.
  # What it does establish is what `slsa-verifier` actually checks:
  # that this repository, at this tag, vouches for these exact bytes.
  # The subject hashes are taken from the published assets, so they match
  # what users download. Prefer the in-line job above; use this only to
  # repair a release that lost its attestation.
  backfill-subjects:
    name: SLSA backfill — hash published assets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provenance_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.provenance_tag }}
        run: |
          set -euo pipefail
          mkdir -p backfill && cd backfill
          # Attest the same artifact classes the in-line job does; the
          # .sig/.pem/.sbom side-files are signatures over these, not
          # build outputs.
          gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.tar.gz' --pattern '*.zip' \
              --pattern '*.deb'    --pattern '*.rpm'
          ls -1
      - name: Compute subject checksums
        id: subjects
        run: |
          set -euo pipefail
          cd backfill
          checksums=$(sha256sum *.tar.gz *.zip *.deb *.rpm 2>/dev/null | base64 -w0)
          if [ -z "$checksums" ]; then
            echo "::error::no assets found on ${{ inputs.provenance_tag }}"
            exit 1
          fi
          echo "subject-checksums=$checksums" >> "$GITHUB_OUTPUT"
    outputs:
      subject-checksums: ${{ steps.subjects.outputs.subject-checksums }}

  backfill-provenance:
    name: SLSA backfill — generate provenance
    needs: [backfill-subjects]
    if: ${{ needs.backfill-subjects.outputs.subject-checksums != '' }}
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.backfill-subjects.outputs.subject-checksums }}"
      upload-assets: true
      # Required when uploading to a release we are not triggered by.
      upload-tag-name: "${{ inputs.provenance_tag }}"
      provenance-name: pg_hardstorage.intoto.jsonl
